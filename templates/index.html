 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Activity Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: #1f2937;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.03);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #374151;
            border-radius: 8px;
            font-size: 20px;
        }

        .examples {
            margin-top: 30px;
            text-align: left;
            color: #cbd5e1;
        }

        .examples code {
            display: block;
            background: #111827;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Security Activity Detector</h1>

        <p class="description">
            Enter an activity or input below to check for suspicious
            SQL Injection and XSS patterns.
        </p>

        <form method="POST">

            <input
                type="text"
                name="text"
                placeholder="Enter activity or suspicious input..."
                required
            >

            <button type="submit">
                SCAN
            </button>

        </form>

        {% if result %}
        <div class="result">
            {{ result }}
        </div>
        {% endif %}

        <div class="examples">

            <strong>Test examples:</strong>

            <code>hello</code>

            <code>&lt;script&gt;alert(1)&lt;/script&gt;</code>

            <code>' OR '1'='1</code>

        </div>

    </div>

</body>
</html>
